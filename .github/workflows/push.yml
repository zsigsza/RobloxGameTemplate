name: Deploy

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "package.json"
      - "**/README.md"
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.1.2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install packages
        run: bun install --frozen-lockfile

      - name: run linter
        run: bun run eslint

  deploy:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.1.2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install packages
        run: bun install --frozen-lockfile

      - name: compile project
        run: bun compile:base

      - name: build production
        run: bun prod:base

      - name: deploy
        env:
          UNIVERSE_ID: ${{ vars.UNIVERSE }}
          PLACE_ID: ${{ vars.PLACE }}
          API_KEY: ${{ secrets.RBX_CLOUD }}
          FILE: places/base/build.rbxl
        run: rbxcloud experience publish -a "$API_KEY" -u "$UNIVERSE_ID" -p "$PLACE_ID" -t published -f "$FILE"
